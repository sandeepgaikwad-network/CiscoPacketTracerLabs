name: CCNA Lab Validation

on:
  push:
    branches:
      - testing

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Lab Folders
        run: |
          failed=0

          for dir in $(find . -type d ! -path! "*/.*");do

            pkt_count=$(find "$dir" -maxdepth 1 -name "*.pkt" | wc -l)

            if [ "$pkt_count" -gt 0 ]; then

              readme_count=$(find "$dir" -maxdepth 1 -name "README.md" | wc -l)
              png_count=$(find "$dir" -maxdepth 1 -name "*.png" | wc -l)

              echo "Checking: $dir"

              if [ "$readme_count" -eq 0 ]; then
                echo "README.md missing in $dir"
                failed=1
              fi

              if [ "$png_count" -eq 0 ]; then
                echo "PNG file missing in $dir"
                failed=1
              fi

            fi

          done

          if [ "$failed" -eq 1 ]; then
            echo "Validation failed"
            exit 1
          fi

          echo "All lab folders passed validation"