name: CCNA Lab Validation

on:
  push:
    branches:
      - testing

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Count README Files
        run: |
          count=$(find . -name "README.md" | wc -l)
          echo "README files: $count"

      - name: Count Packet Tracer Files
        run: |
          count=$(find . -name "*.pkt" | wc -l)
          echo "PKT files: $count"

      - name: Count PNG Files
        run: |
          count=$(find . -name "*.png" | wc -l)
          echo "PNG files: $count"

      - name: Validation Complete
        run: echo "CCNA Lab Validation Passed ✅"