name: CCNA Lab Validation

on:
  push:
    branches:
      - testing

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Lab Folders
        run: |
          failed=0

          while IFS= read -r pktfile; do
            folder=$(dirname "$pktfile")

            echo "Checking folder: $folder"

            if [ ! -f "$folder/README.md" ]; then
              echo "ERROR: README.md missing in $folder"
              failed=1
            fi

            png_count=$(find "$folder" -maxdepth 1 -name "*.png" | wc -l)

            if [ "$png_count" -eq 0 ]; then
              echo "ERROR: PNG file missing in $folder"
              failed=1
            fi

          done < <(find . -name "*.pkt")

          if [ "$failed" -eq 1 ]; then
            echo "Validation failed."
            exit 1
          fi

          echo "All lab folders passed validation."