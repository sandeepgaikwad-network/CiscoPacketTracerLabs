name: CCNA Lab Validation

on:
  push:
    branches:
      - testing

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Lab Folders and Generate Summary Report
        shell: bash
        run: |
          failed=0
          total=0
          passed=0
          failed_count=0

          REPORT_FILE="lab-validation-summary.md"

          echo "# CCNA Lab Validation Summary" > "$REPORT_FILE"
          echo "" >> "$REPORT_FILE"
          echo "| Lab Folder | PKT Files | README.md | PNG Files | Status | Missing Files |" >> "$REPORT_FILE"
          echo "|------------|-----------|-----------|-----------|--------|---------------|" >> "$REPORT_FILE"

          declare -A checked_folders

          while IFS= read -r -d '' pktfile; do
            folder="$(dirname "$pktfile")"
            checked_folders["$folder"]=1
          done < <(find . -type f -name "*.pkt" -not -path "./.git/*" -not -path "./.github/*" -print0)

          if [ ${#checked_folders[@]} -eq 0 ]; then
            echo "No Packet Tracer files found in repository." >> "$REPORT_FILE"
            cat "$REPORT_FILE" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          for folder in "${!checked_folders[@]}"; do
            total=$((total + 1))

            pkt_count=$(find "$folder" -maxdepth 1 -type f -name "*.pkt" | wc -l)
            readme_count=$(find "$folder" -maxdepth 1 -type f -name "README.md" | wc -l)
            png_count=$(find "$folder" -maxdepth 1 -type f -name "*.png" | wc -l)

            missing=""

            if [ "$pkt_count" -eq 0 ]; then
              missing="${missing} PKT"
            fi

            if [ "$readme_count" -eq 0 ]; then
              missing="${missing} README.md"
            fi

            if [ "$png_count" -eq 0 ]; then
              missing="${missing} PNG"
            fi

            if [ -z "$missing" ]; then
              status="PASS"
              passed=$((passed + 1))
              missing="None"
            else
              status="FAIL"
              failed=1
              failed_count=$((failed_count + 1))
            fi

            echo "| $folder | $pkt_count | $readme_count | $png_count | $status | $missing |" >> "$REPORT_FILE"
          done

          echo "" >> "$REPORT_FILE"
          echo "## Final Result" >> "$REPORT_FILE"
          echo "" >> "$REPORT_FILE"
          echo "- Total lab folders checked: $total" >> "$REPORT_FILE"
          echo "- Passed: $passed" >> "$REPORT_FILE"
          echo "- Failed: $failed_count" >> "$REPORT_FILE"

          cat "$REPORT_FILE" >> "$GITHUB_STEP_SUMMARY"

          if [ "$failed" -eq 1 ]; then
            echo "Validation failed. Some lab folders are missing required files."
            exit 1
          fi

          echo "All lab folders passed validation."

      - name: Upload Summary Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ccna-lab-validation-summary
          path: lab-validation-summary.md